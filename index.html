<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Card2PDF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
        font-family: sans-serif;
        max-width: 900px;
        margin: 40px auto;
        }

        #dropzone {
        border: 2px dashed #888;
        padding: 40px;
        text-align: center;
        border-radius: 10px;
        margin-bottom: 20px;
        }

        #fileInput {
        margin-top: 10px;
        }

        /* Two-column layout */
        #content {
        display: grid;
        grid-template-columns: 250px 1fr;
        gap: 20px;
        margin-top: 20px;
        }

        /* Left column buttons */
        #controls {
        display: flex;
        flex-direction: column;
        gap: 10px;
        }

        button {
        padding: 10px 16px;
        font-size: 15px;
        cursor: pointer;
        }

        #clearBtn {
        background: #777;
        color: white;
        }

        /* Right column list */
        #fileList {
        border: 1px solid #ccc;
        padding: 10px;
        border-radius: 6px;
        max-height: 500px;
        overflow-y: auto;
        }

        .file-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 0;
        font-size: 14px;
        border-bottom: 1px solid #eee;
        }

        .file-item:last-child {
        border-bottom: none;
        }

        .remove-btn {
        background: #d9534f;
        color: white;
        border: none;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
        }
  </style>
</head>

<body>

<h1>Card2PDF</h1>

<div id="dropzone">
  <p>Drag & drop images here</p>
  <p>or</p>
  <input type="file" id="fileInput" multiple accept="image/*">
</div>

<!-- Two-column layout -->
<div id="content">
  <!-- Left column -->
  <div id="controls">
    <button id="compileBtn">Compile PDFs</button>
    <button id="clearBtn">Clear All</button>
  </div>

  <!-- Right column -->
  <div id="fileList"></div>
</div>

<script type="module">
  import { generateCardPDFs } from "./cards2pdfBrowser.js";

  const images = [];

  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("fileInput");
  const fileList = document.getElementById("fileList");
  const compileBtn = document.getElementById("compileBtn");
  const clearBtn = document.getElementById("clearBtn");

  dropzone.addEventListener("dragover", e => {
    e.preventDefault();
    dropzone.style.background = "#eee";
  });

  dropzone.addEventListener("dragleave", () => {
    dropzone.style.background = "";
  });

  dropzone.addEventListener("drop", e => {
    e.preventDefault();
    dropzone.style.background = "";
    handleFiles(e.dataTransfer.files);
  });

  fileInput.addEventListener("change", e => {
    handleFiles(e.target.files);
  });

  function handleFiles(fileListInput) {
    for (const file of fileListInput) {
      if (!file.type.startsWith("image/")) continue;

      const reader = new FileReader();
      reader.onload = e => {
        images.push({
          name: file.name,
          dataUrl: e.target.result
        });
        renderList();
      };
      reader.readAsDataURL(file);
    }
  }

  function renderList() {
    fileList.innerHTML = images
      .map((img, index) => `
        <div class="file-item">
          <span>${img.name}</span>
          <button class="remove-btn" data-index="${index}">X</button>
        </div>
      `)
      .join("");

    document.querySelectorAll(".remove-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = parseInt(btn.dataset.index, 10);
        images.splice(idx, 1);
        renderList();
      });
    });
  }

  compileBtn.addEventListener("click", () => {
    if (images.length === 0) {
      alert("No images loaded.");
      return;
    }
    generateCardPDFs(images);
  });
</script>

</body>
</html>
